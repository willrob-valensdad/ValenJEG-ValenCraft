plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.2'
}

version = '1.16.26+fabric26.3-valen.1'
group = 'earth.terrarium.adastra'

base {
    archivesName = 'ad-astra'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.teamresourceful.com/repository/maven-public/' }
    maven { url = 'https://maven.blamejared.com' }
}

def cslClasses = file('../deps/common-storage-lib/build/classes/java/main')

dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.165.0+26.3'
    implementation 'com.teamresourceful.resourcefullib:resourcefullib-fabric-26.3:6.0.1'
    implementation 'com.teamresourceful.resourcefulconfig:resourcefulconfig-fabric-26.3:6.0.2'
    implementation 'com.teamresourceful:bytecodecs:1.1.2'
    include 'com.teamresourceful:bytecodecs:1.1.2'
    def jlayer = 'javazoom:jlayer:1.0.1'
    implementation jlayer
    include jlayer
    compileOnly files(cslClasses)
    compileOnly files('compile-inputs/RoughlyEnoughItems-26.3.824.jar')
    compileOnly files('compile-inputs/basic-math-0.6.1.jar')
    compileOnly 'mezz.jei:jei-26.3-fabric:31.17.0.93'
    compileOnly 'mezz.jei:jei-26.3-common-api:31.17.0.93'
    compileOnly 'mezz.jei:jei-26.3-common:31.17.0.93'
    compileOnly files('compile-inputs/energy-5.0.0.jar')
}

def generatedJava = layout.buildDirectory.dir('fabric-src')

tasks.register('prepareFabricSources', Exec) {
    commandLine 'bash', file('../tools/prepare-adastra-sources.sh').absolutePath
    inputs.dir('src/main/java')
    inputs.dir('src/fabric/java')
    outputs.dir(generatedJava)
}

sourceSets {
    main {
        java {
            setSrcDirs([generatedJava])
        }
        resources {
            srcDir 'src/main/resources'
            srcDir 'src/main/generated/resources'
            srcDir 'src/fabric/resources'
            srcDir 'port'
        }
    }
}

tasks.compileJava {
    dependsOn tasks.named('prepareFabricSources')
}

tasks.processResources {
    from('src/main/adastra-common.mixins.json')
    from('src/fabric/adastra.mixins.json')
}
