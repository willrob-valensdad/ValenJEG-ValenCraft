plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

repositories {
    maven {
        name = 'CurseMaven'
        url = uri('https://www.cursemaven.com')
        content {
            includeGroup 'curse.maven'
        }
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output',
                    file('src/generated/resources/').getAbsolutePath(), '--existing',
                    file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // User-supplied NeoForge 26.2 dependency jars. These are compile/runtime dependencies,
    // not shaded into the Scorched Guns output jar.
    implementation files('libs/framework-neoforge-26.2-0.13.26.jar')
    implementation files('libs/curios-neoforge-16.0.0+26.2.jar')
    implementation files('libs/geckolib-neoforge-26.2-5.5.4.jar')

    // Optional JEI 26.2 integration: API at compile time, full mod in runClient only.
    compileOnly files('libs/jei-26.2-neoforge-30.29.0.201.jar')
    localRuntime files('libs/jei-26.2-neoforge-30.29.0.201.jar')

    // Optional EMF/ETF compile-time API only. These are not bundled into the output jar.
    // EMF 3.3 introduced the public animation hook used by Fresh Animations compatibility.
    compileOnly 'curse.maven:entity-texture-features-fabric-568563:8782714'
    compileOnly 'curse.maven:entity-model-features-844662:8782788'
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '1000', '-Xdiags:verbose'])
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
