license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="ribs (original author); unofficial 26.2 port maintainer"
credits="Original Scorched Guns by ribs; Framework by MrCrayfish"
description="""
Unofficial NeoForge 26.2 port workspace for Scorched Guns 0.5.5.
This build metadata is intentionally conservative while the 1.20.1 systems are migrated.
"""

[[mixins]]
config = "scguns.render.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="framework"
type="required"
versionRange="[0.13.26,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="curios"
type="required"
versionRange="[16.0.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="geckolib"
type="required"
versionRange="[5.5.4,)"
ordering="AFTER"
side="BOTH"
